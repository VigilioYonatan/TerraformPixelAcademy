name: Terraform offline labs & static IaC policy gates (37 CLI + TFLint/Trivy/Conftest)
on:
  pull_request:
    paths:
      - 'labs/offline/**'
      - 'labs/senior/S13/**'
      - 'labs/senior/S18/**'
      - 'scripts/verify-terraform-labs.*'
      - 'scripts/ensure-iac-scanners.mjs'
      - 'scripts/run-iac-scanners.mjs'
      - '.github/workflows/terraform-labs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terraform-labs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false
      - name: Run 36 offline labs and local S18 capstone
        shell: bash
        run: bash scripts/verify-terraform-labs.sh
      - name: Install and SHA-256 verify TFLint, Conftest & Trivy
        run: node scripts/ensure-iac-scanners.mjs
      - name: Run TFLint, Trivy Config & Conftest OPA policy suites (S13 + S18)
        run: node scripts/run-iac-scanners.mjs --use-local-tools
      - name: Upload CLI verification evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-cli-evidence
          path: terraform-verification-results/
          if-no-files-found: warn
          retention-days: 7
