name: Academy quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frozen dependencies
        run: npm ci --ignore-scripts
      - name: Verify vendored TypeScript
        run: node tools/typescript/bin/tsc --version
      - name: Lint and format (Biome)
        run: npm run lint:biome
      - name: Build offline and Vite production bundle
        run: npm run build && npm run build:vite
      - name: Typecheck, unit/BDD, Vitest components and local security
        run: npm run qa
      - name: Baseline route preservation
        run: npm run verify:preservation
      - name: Structural and archive parity audit
        run: python3 scripts/release-audit.py
      - name: Confirm generated artifacts
        run: test -f dist/index.html && test -f dist/assets/terra/hola.png && test -f dist/.vite/manifest.json
  e2e-http:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frozen dependencies
        run: npm ci --ignore-scripts
      - name: Build Vite artifact for E2E
        run: npm run build:vite
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright HTTP E2E, CSP and WCAG 2.2 AA Axe suite
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
