name: DevSecOps and Biome
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frozen dependencies
        run: npm ci --ignore-scripts
      - name: Build Vite bundle before preservation & QA gates
        run: npm run build:vite
      - name: TypeScript, Node BDD/unit, Vitest components and local security
        run: npm run qa
      - name: Local DevSecOps file and secret gate
        run: npm run security:local
      - name: Biome (actual CLI)
        run: npm run lint:biome
      - name: Dependency vulnerabilities (runtime high/critical + full critical)
        run: npm audit --omit=dev --audit-level=high && npm audit --audit-level=critical
      - name: Static release and Vite bundle budget gate
        run: npm run release:gate && npm run build:vite
      - name: Validate GitHub Actions workflows with actionlint
        run: node scripts/run-actionlint.mjs
      - name: Upload build for manual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terrapixel-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
